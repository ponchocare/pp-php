version: 2

updates:
  # The library's own composer.json. There is no composer.lock (it is
  # gitignored), so Dependabot only opens a PR when a release falls outside the
  # current constraint (in practice, a new major). Being a `library`, the
  # default strategy widens the range (e.g. `^7.4` -> `^7.4 || ^8.0`) instead of
  # dropping the old major for consumers. example/ is not listed: its only
  # dependency is this package, through a path repository.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tooling only: lint and tests catch any breakage, so one PR is enough.
      # Runtime dependencies stay in separate PRs, as each one widens what
      # consumers can install.
      dev-dependencies:
        dependency-type: development

  # Actions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
